services:
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RISKGUARD_API_KEY: ${RISKGUARD_API_KEY:?Set RISKGUARD_API_KEY before starting Compose}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      RISKGUARD_LOG_LEVEL: ${RISKGUARD_LOG_LEVEL:-INFO}
      RISKGUARD_RATE_LIMIT_REQUESTS: ${RISKGUARD_RATE_LIMIT_REQUESTS:-60}
      RISKGUARD_RATE_LIMIT_WINDOW_SECONDS: ${RISKGUARD_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - riskguard-data:/app/data

  dashboard:
    build: .
    command: ["streamlit", "run", "scripts/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      RISKGUARD_LOG_LEVEL: ${RISKGUARD_LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    volumes:
      - riskguard-data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  riskguard-data:
